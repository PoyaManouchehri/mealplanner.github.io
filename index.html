<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week Service — meal planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bench:#DCE1DC;
  --bench-dk:#C9D0CA;
  --docket:#FCFBF8;
  --ink:#14262E;
  --ink-soft:#3D555E;
  --muted:#6C7F84;
  --tile:#0E6E63;
  --tile-dk:#0A4F47;
  --saffron:#E0A008;
  --saffron-dk:#A97705;
  --rule:#C2CAC3;
  --rule-soft:#E2E6E1;
  --warn:#9C3B1B;
  --r:3px;
  --shadow:0 1px 0 rgba(20,38,46,.06), 0 6px 18px -10px rgba(20,38,46,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bench);
  color:var(--ink);
  font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.cond{font-family:'Archivo Narrow','Archivo',sans-serif}

/* ---------- header ---------- */
header{
  background:var(--ink);
  color:#EAEFEA;
  padding:16px 22px 0;
  position:sticky;top:0;z-index:40;
  box-shadow:0 8px 24px -16px rgba(0,0,0,.8);
}
.head-top{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
h1{
  font-family:'Archivo Narrow',sans-serif;
  font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;
  margin:0;line-height:1;
}
h1 span{color:var(--saffron)}
.sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8FA5A4;margin:5px 0 0}
.actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;padding-bottom:2px}
button{font-family:inherit;font-size:12px;cursor:pointer;border-radius:var(--r)}
.btn{
  background:transparent;color:#D5DEDA;border:1px solid #3A5058;
  padding:7px 13px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;
  transition:background .12s,border-color .12s,color .12s;
}
.btn:hover{background:#1E353E;border-color:#54707A;color:#fff}
.btn-go{background:var(--saffron);border-color:var(--saffron);color:#2A1D00}
.btn-go:hover{background:#F2B421;border-color:#F2B421;color:#2A1D00}

/* targets rail */
.targets{
  display:flex;gap:0;margin:14px -22px 0;padding:0 22px;
  border-top:1px solid #24404A;
  overflow-x:auto;
}
.t-cell{
  padding:9px 18px 10px;border-right:1px solid #24404A;min-width:96px;
}
.t-cell:first-child{padding-left:0}
.t-lab{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#7E9695}
.t-val{font-size:16px;font-weight:600;color:#EAEFEA;margin-top:1px}
.t-val em{font-style:normal;font-size:10px;color:#7E9695;margin-left:2px}
.t-cell.total{margin-left:auto;border-right:none;text-align:right;padding-right:0}
.t-cell.total .t-val{color:var(--saffron)}

/* ---------- board ---------- */
main{padding:20px 22px 60px}
.board{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;
}
.day{
  background:var(--docket);border:1px solid var(--rule);border-radius:var(--r);
  display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);
}
.day-head{
  padding:9px 10px 8px;border-bottom:1px solid var(--rule-soft);
  display:flex;align-items:center;gap:6px;
}
.day-name{
  font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:13px;
  letter-spacing:.15em;text-transform:uppercase;
}
.kindy-tag{
  margin-left:auto;font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  border:1px solid var(--tile);color:var(--tile);padding:2px 5px;border-radius:2px;
  background:transparent;font-weight:600;
}
.kindy-tag.off{border-color:var(--rule);color:#A9B4AC}
.kindy-tag:hover{background:var(--tile);color:#fff;border-color:var(--tile)}
.kindy-tag.off:hover{background:var(--rule-soft);color:var(--muted)}

/* calorie bar */
.bar{display:flex;height:4px;background:var(--rule-soft)}
.bar i{display:block;height:100%}
.bar i:nth-child(1){background:var(--tile)}
.bar i:nth-child(2){background:var(--saffron)}
.bar i:nth-child(3){background:var(--tile-dk)}
.bar i:nth-child(4){background:var(--saffron-dk)}
.bar i:nth-child(5){background:#2E555C}

.slots{padding:6px;display:flex;flex-direction:column;gap:5px;flex:1}
.slot{
  border:1px solid var(--rule-soft);border-radius:var(--r);background:#fff;
  padding:6px 7px 7px;position:relative;text-align:left;width:100%;
  cursor:pointer;font-family:inherit;transition:border-color .12s,box-shadow .12s;
}
.slot:hover{border-color:var(--tile);box-shadow:0 0 0 2px rgba(14,110,99,.09)}
.slot:focus-visible,.btn:focus-visible,.swap:focus-visible,.kindy-tag:focus-visible{
  outline:2px solid var(--saffron);outline-offset:1px}
.slot-lab{
  font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:5px;
}
.slot-lab .mins{margin-left:auto;color:#A2AEA8}
.slot-name{font-size:12.5px;font-weight:500;line-height:1.25;margin:3px 0 5px;color:var(--ink)}
.slot-nums{display:flex;gap:7px;align-items:baseline}
.kcal{font-size:12px;font-weight:600;color:var(--ink)}
.kcal em{font-style:normal;font-size:9px;color:var(--muted);margin-left:1px}
.pro{font-size:10px;color:var(--tile);font-weight:600}
.swap-cta{
  display:block;width:100%;margin:0 0 18px;padding:12px 14px;
  background:var(--tile);border:1px solid var(--tile);color:#fff;
  font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  font-family:'Archivo',sans-serif;
}
.swap-cta:hover{background:var(--tile-dk);border-color:var(--tile-dk)}
.swap{
  position:absolute;top:5px;right:5px;border:1px solid var(--rule-soft);
  background:#F2F5F1;color:var(--tile);font-size:12px;line-height:1;
  padding:3px 5px;border-radius:2px;
}
.swap:hover{background:var(--tile);color:#fff;border-color:var(--tile)}
.slot.empty .slot-name{color:#A9B4AC;font-style:italic}

.day-foot{border-top:1px solid var(--rule-soft);padding:6px 8px 7px;display:flex;align-items:center;gap:6px}
.day-tot{font-size:11px;font-weight:600}
.day-tot.over{color:var(--warn)}
.day-tot.under{color:var(--tile)}
.day-pro{font-size:10px;color:var(--muted);margin-left:auto}
/* ---------- week tabs + lock ---------- */
.tabs{display:flex;gap:0;margin-top:12px;border-bottom:1px solid #24404A;flex-wrap:wrap}
.tab{
  background:transparent;border:none;border-bottom:2px solid transparent;
  color:#8FA5A4;font-family:'Archivo Narrow',sans-serif;font-weight:700;
  font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  padding:9px 16px 8px;border-radius:0;
}
.tab:hover{color:#D5DEDA}
.tab[aria-selected="true"]{color:var(--saffron);border-bottom-color:var(--saffron)}
.tab .pin{font-size:10px;opacity:.8;margin-left:7px}
.lockstate{margin-left:auto;display:flex;align-items:center;gap:9px;padding-bottom:6px}
.lock-note{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7E9695}
.btn-lock{
  background:transparent;border:1px solid #3A5058;color:#D5DEDA;padding:6px 12px;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
}
.btn-lock.on{border-color:var(--saffron);color:var(--saffron);background:rgba(224,160,8,.09)}
.btn-lock:hover{background:#1E353E}
.btn-lock.on:hover{background:rgba(224,160,8,.18)}
.btn[disabled]{opacity:.32;cursor:not-allowed}
.btn[disabled]:hover{background:transparent;border-color:#3A5058;color:#D5DEDA}
.btn.confirming{background:var(--warn);border-color:var(--warn);color:#fff}

.locked-banner{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:#EEF1EC;border:1px solid var(--rule);border-left:3px solid var(--tile);
  border-radius:var(--r);padding:9px 13px;margin-bottom:12px;font-size:12.5px;color:var(--ink-soft);
}
.locked-banner b{color:var(--ink)}
.share-url{
  font-family:'IBM Plex Mono',monospace;font-size:11px;padding:9px 10px;
  border:1px solid var(--rule);border-radius:var(--r);background:#fff;color:var(--ink);
  word-break:break-all;max-height:120px;overflow:auto;
}
.copy-btn{
  margin-top:10px;background:var(--tile);color:#fff;border:1px solid var(--tile);
  padding:10px 16px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
}
.copy-btn:hover{background:var(--tile-dk);border-color:var(--tile-dk)}

/* prep + action rail — sits above the board, outside the week */
.rail{display:flex;gap:10px;margin:0 0 14px;flex-wrap:wrap;align-items:stretch}
.rail-lab{
  display:flex;align-items:center;font-family:'Archivo Narrow',sans-serif;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding-right:4px;
}
.prep-card{
  flex:1 1 230px;text-align:left;font-family:inherit;cursor:pointer;
  background:#F6F2E4;border:1px solid var(--saffron);border-left-width:3px;
  border-radius:var(--r);padding:10px 13px;display:flex;align-items:center;gap:14px;
  min-height:48px;transition:background .12s;
}
.prep-card:hover{background:#FBF4DE}
.prep-card.quiet{background:var(--docket);border-color:var(--rule);border-left-color:var(--rule)}
.prep-card.quiet:hover{background:#F4F6F2}
.prep-card.tool{flex:0 1 172px;background:var(--docket);border-color:var(--rule);border-left-color:var(--tile)}
.prep-card.tool:hover{background:#F1F7F4}
.pc-when{
  font-family:'Archivo Narrow',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink);display:block;
}
.pc-note{font-size:11px;color:var(--muted);margin-top:2px;display:block}
.pc-mins{margin-left:auto;text-align:right;white-space:nowrap}
.pc-mins b{display:block;font-size:17px;font-weight:600;color:var(--saffron-dk)}
.prep-card.quiet .pc-mins b{color:var(--muted)}
.pc-mins span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- drawer ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(20,38,46,.42);opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:50;
}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(500px,100%);
  background:var(--docket);z-index:60;transform:translateX(102%);
  transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:-20px 0 50px -30px rgba(0,0,0,.7);
}
.drawer.on{transform:none}
/* torn docket edge */
.drawer::before{
  content:"";position:absolute;top:0;left:0;right:0;height:6px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 10px);
  opacity:.85;
}
.d-head{padding:20px 24px 14px;border-bottom:1px solid var(--rule)}
.d-eyebrow{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--tile);font-weight:700}
.d-title{
  font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:23px;
  line-height:1.1;margin:6px 0 0;letter-spacing:.01em;
}
.d-meta{display:flex;gap:16px;margin-top:9px;flex-wrap:wrap}
.d-meta div{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.d-meta b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;text-transform:none;margin-top:1px}
.d-close{
  position:absolute;top:18px;right:20px;background:transparent;border:1px solid var(--rule);
  width:28px;height:28px;color:var(--ink-soft);font-size:15px;line-height:1;
}
.d-close:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.d-body{padding:18px 24px 40px;overflow-y:auto;flex:1}
.d-blurb{color:var(--ink-soft);font-size:13.5px;margin:0 0 20px}

.sec-lab{
  font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule);
  display:flex;align-items:baseline;
}
.sec-lab span{margin-left:auto;letter-spacing:.08em;color:#A2AEA8}
.sec{margin-bottom:26px}

/* portions = scale readout */
.port{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px dotted var(--rule-soft)}
.port-n{flex:1;font-size:13px}
.port-a{font-size:13px;font-weight:600;color:var(--tile);min-width:62px;text-align:right}
.port-c{font-size:11.5px;color:var(--muted);min-width:52px;text-align:right}
.port.sum{border-bottom:none;border-top:2px solid var(--ink);margin-top:4px;padding-top:8px;font-weight:600}
.port.sum .port-n{font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.port.sum .port-a{color:var(--ink)}
.budget-note{margin-top:9px;font-size:11.5px;color:var(--muted)}
.budget-note b{color:var(--ink)}
.budget-note.over b{color:var(--warn)}

ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{
  counter-increment:s;position:relative;padding:0 0 12px 30px;font-size:13.5px;color:var(--ink-soft);
}
ol.steps li::before{
  content:counter(s);position:absolute;left:0;top:1px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
  width:19px;height:19px;border:1px solid var(--tile);color:var(--tile);
  display:flex;align-items:center;justify-content:center;border-radius:50%;
}
ul.plain{margin:0;padding:0;list-style:none}
ul.plain li{padding:5px 0;border-bottom:1px dotted var(--rule-soft);font-size:13px;display:flex;gap:10px}
ul.plain li b{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px}

/* swap list */
.alt{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:#fff;border:1px solid var(--rule-soft);border-radius:var(--r);
  padding:9px 11px;margin-bottom:6px;font-family:inherit;
}
.alt:hover{border-color:var(--tile);background:#F5FAF8}
.alt.cur{border-color:var(--saffron);background:#FDF8EA}
.alt-n{flex:1;font-size:13px;font-weight:500}
.alt-n i{display:block;font-style:normal;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:1px}
.alt-c{font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}

.chip{
  display:inline-block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule);color:var(--muted);padding:2px 6px;border-radius:2px;margin:0 4px 4px 0;
}
.chip.batch{border-color:var(--saffron-dk);color:var(--saffron-dk);background:#FDF8EA}
.sess{margin-bottom:26px}
.sess-h{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
.sess-h h3{font-family:'Archivo Narrow',sans-serif;font-size:16px;letter-spacing:.1em;text-transform:uppercase;margin:0}
.sess-h span{font-size:11px;color:var(--muted)}
.task{border-left:2px solid var(--tile);padding:2px 0 2px 12px;margin-bottom:14px}
.task-n{font-size:13.5px;font-weight:600;margin-bottom:2px}
.task-m{font-size:11px;color:var(--muted);margin-bottom:6px}
.task ol{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink-soft)}
.task ol li{padding:1px 0}
.empty-note{color:var(--muted);font-size:13px;font-style:italic}
.foot-note{
  margin-top:8px;padding:11px 13px;background:#EEF1EC;border-left:2px solid var(--rule);
  font-size:12px;color:var(--ink-soft);
}
.cat-h{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tile);
  font-weight:700;margin:18px 0 4px;
}
.cat-h:first-child{margin-top:0}
@media (max-width:1180px){ .board{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:900px){ .board{grid-template-columns:repeat(2,minmax(0,1fr))} }

@media (max-width:640px){
  header{position:static;padding:12px 14px 0}
  main{padding:14px 14px 48px}
  h1{font-size:21px}
  .head-top{gap:12px}
  .actions{width:100%;margin-left:0;gap:6px}
  .actions .btn{flex:1 1 auto;padding:11px 8px;font-size:11px}
  .targets{margin:10px -14px 0;padding:0 14px}
  .t-cell{min-width:76px;padding:8px 12px 9px}
  .t-val{font-size:14px}
  .tabs{margin-top:10px}
  .tab{flex:1 1 auto;padding:12px 8px 10px;font-size:12px;letter-spacing:.1em}
  .lockstate{width:100%;margin-left:0;padding:8px 0;border-top:1px solid #24404A}
  .btn-lock{padding:9px 14px}

  .rail{gap:8px}
  .rail-lab{display:none}
  .prep-card{flex:1 1 100%}
  .prep-card.tool{flex:1 1 calc(50% - 4px)}

  /* one day per row, slots become compact horizontal lines */
  .board{grid-template-columns:1fr;gap:8px}
  .day-head{padding:11px 12px 10px}
  .day-name{font-size:15px}
  .slots{padding:8px;gap:6px}
  .slot{
    display:grid;grid-template-columns:64px 1fr auto;align-items:center;
    gap:10px;padding:11px 36px 11px 11px;min-height:48px;
  }
  .slot-lab{margin:0;font-size:8px;letter-spacing:.11em;line-height:1.3}
  .slot-lab .mins{display:none}
  .slot-name{margin:0;font-size:13.5px}
  .slot-nums{flex-direction:column;align-items:flex-end;gap:0}
  .kcal{font-size:13px}
  .swap{top:50%;transform:translateY(-50%);right:8px;font-size:16px;padding:7px}
  .day-foot{padding:10px 12px}

  .drawer{width:100%}
  .d-head{padding:22px 18px 14px}
  .d-body{padding:16px 18px 48px}
  .d-title{font-size:21px}
  .alt{padding:12px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header>
  <div class="head-top">
    <div>
      <h1>Week <span>Service</span></h1>
      <p class="sub">Poya · 1 measured plate, 3 people eating <span id="syncChip"></span></p>
    </div>
    <div class="actions">
      <button class="btn btn-go" id="gen">Generate week</button>
      <button class="btn" id="roll">Start new week</button>
      <button class="btn" id="share">Share</button>
      <button class="btn" id="exp">Export data</button>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tabCurrent" role="tab" aria-selected="true">This week</button>
    <button class="tab" id="tabNext" role="tab" aria-selected="false">Next week</button>
    <div class="lockstate">
      <span class="lock-note" id="lockNote"></span>
      <button class="btn-lock" id="lockBtn"></button>
    </div>
  </div>
  <div class="targets" id="targets"></div>
</header>

<main>
  <div id="banner"></div>
  <div class="rail" id="rail"></div>
  <div class="board" id="board"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="d-head">
    <div class="d-eyebrow" id="dEyebrow"></div>
    <h2 class="d-title" id="dTitle"></h2>
    <div class="d-meta" id="dMeta"></div>
    <button class="d-close" id="dClose" aria-label="Close">✕</button>
  </div>
  <div class="d-body" id="dBody"></div>
</aside>

<script>
/* ============================================================
   DATA — edit this block to add, remove or change meals.
   portion  = {n:name, a:amount, c:calories, p:protein}
   buy      = {n:item, q:quantity, c:category}
   base     = id of a prep item this meal depends on (or null)
   Meal calories/protein are the SUM of its portions, so the
   numbers on the board always match the docket.
   ============================================================ */

/* Slot budgets sum to the daily target. Breakfast carries the daily flat white
   (120 cal), which is why it is the largest slot after dinner. */
const TARGETS = { breakfast:470, snack1:145, lunch:395, dinner:525, snack2:115 };  // sums to 1650
const DAILY   = { cal:1650, protein:140 };

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const SLOTS = [
  {k:'breakfast',lab:'Breakfast'},
  {k:'lunch',lab:'Lunch'},
  {k:'snack1',lab:'Afternoon snack'},
  {k:'dinner',lab:'Dinner'},
  {k:'snack2',lab:'Late snack'}
];
// Share links encode slots positionally, so that order is frozen here and must not
// follow SLOTS — reordering the board would otherwise scramble every existing link.
const WIRE_SLOTS = ['breakfast','snack1','lunch','dinner','snack2'];
const byId = id => MEALS.find(m=>m.id===id);
const pool = slot => MEALS.filter(m=>m.slot===slot);
/* `base` is one prep id or a list of them. Fried rice leans on the poached
   chicken AND the cooked rice, and both have to be scheduled. */
const basesOf = m => !m || !m.base ? [] : (Array.isArray(m.base) ? m.base : [m.base]).filter(b=>PREP[b]);
/* Staples (rice) are prepped like anything else but they do not cluster the week
   the way a batch protein does — every second dinner wants rice, so clustering on
   it would defeat the point. Only main bases drive dinner and lunch placement. */
const mainBases = m => basesOf(m).filter(b=>!PREP[b].staple);
const cal  = m => m ? m.portions.reduce((s,p)=>s+p.c,0) : 0;
const pro  = m => m ? m.portions.reduce((s,p)=>s+p.p,0) : 0;
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

/* state holds two weeks. Each: {days:[{slot:mealId}], kindy:[dayIdx], locked:bool} */
let state = null;
const wk = () => state[state.view];
const editable = () => !wk().locked;

/* ---------- generation ---------- */
function buildWeek(){
  const days = DAYS.map(()=>({}));

  /* Dinners. Batch proteins are clustered into one half of the week so each
     batch gets cooked once, not twice: one base feeds Mon–Thu off the Sunday
     session, another feeds Fri–Sun off the Wednesday top-up. The remaining
     three nights are cook-fresh or bought. */
  const dinners = pool('dinner');
  const bought  = dinners.find(d=>d.id==='d-bought');
  const availBases = shuffle([...new Set(dinners.flatMap(d=>mainBases(d)))]);

  /* A cluster is only real if the batch survives to the days it is put on. The
     joojeh marinade keeps two days, so from Sunday it reaches Monday and Tuesday
     and no further — put it on Wednesday and it quietly falls through to the
     Wednesday session, which leaves you marinating an hour before dinner and an
     empty Sunday. So each base is only offered the days its shelf life reaches. */
  const reaches = (b, dayIdx, session) => {
    const keeps = PREP[b].keeps || 4, day = dayIdx + 1;
    /* A marinade cannot be mixed the afternoon it is eaten. */
    if(day < session + (PREP[b].restsOvernight ? 1 : 0)) return false;
    if(session === SUNDAY_DAY) return day <= keeps;
    /* A late-cluster day has to be one Sunday genuinely cannot reach. Otherwise
       prepPlan puts that day back on Sunday and the batch gets cooked twice. */
    return day > keeps && day - session <= keeps;
  };
  const dinnersOn = b => dinners.filter(d=>mainBases(d).includes(b));

  const draw = (bases, dayPool, want, session) => {   // `want` dinners from as few bases as possible
    const out=[], used=new Set();
    let free = shuffle(dayPool);
    const take = (b, n) => {
      const fit = free.filter(d=>reaches(b, d, session)).slice(0, n);
      const ds  = shuffle(dinnersOn(b)).slice(0, fit.length);
      ds.forEach((m,i)=>{ out.push({meal:m, dayIdx:fit[i]}); });
      if(ds.length){ used.add(b); free = free.filter(d=>!fit.slice(0,ds.length).includes(d)); }
    };
    /* One base covering the whole cluster is the point — it is what keeps the
       batch to a single cook. Only settle for a partial fill if none can. */
    const whole = bases.filter(b => free.filter(d=>reaches(b, d, session)).length >= want
                                 && dinnersOn(b).length >= want);
    if(whole.length) take(whole[0], want);
    for(const b of bases){ if(out.length>=want) break; if(!used.has(b)) take(b, want-out.length); }
    return {out, used};
  };

  const earlyDraw = draw(availBases, [0,1,2,3], 2, SUNDAY_DAY);
  /* Every day the early cluster left. Which of them a base may actually use is
     `reaches`'s problem — a 4-day base still only gets Fri to Sun, but the 2-day
     marinade can take Thursday and Friday off the Wednesday session. */
  const lateDayPool = [0,1,2,3,4,5,6].filter(d=>!earlyDraw.out.some(x=>x.dayIdx===d));
  const lateDraw  = draw(availBases.filter(b=>!earlyDraw.used.has(b)), lateDayPool, 2, MIDWEEK_DAY);

  const taken = new Set();
  const clustered = [...earlyDraw.out, ...lateDraw.out];
  clustered.forEach(x=>{ days[x.dayIdx].dinner = x.meal.id; taken.add(x.dayIdx); });

  const usedIds = new Set(clustered.map(x=>x.meal.id));
  const fillers = shuffle([
    bought,
    ...shuffle(dinners.filter(d=>d.id!=='d-bought' && !usedIds.has(d.id) && !mainBases(d).length))
  ]);
  let fi=0;
  DAYS.forEach((_,i)=>{ if(!taken.has(i)) days[i].dinner = (fillers[fi++] || pick(dinners)).id; });

  /* Breakfast. Oats are batched, so they repeat — but never on consecutive
     mornings, and never outside Mon–Fri. Two adjacent oat days is the fastest
     way to stop wanting oats. */
  const oats = 'b-oats';
  const want = 2 + Math.round(Math.random());          // 2 or 3 jars
  let oatDays = [];
  for(let attempt=0; attempt<8 && oatDays.length<want; attempt++){
    const trial = [];
    for(const d of shuffle([0,1,2,3,4])){
      if(trial.length>=want) break;
      if(trial.some(x=>Math.abs(x-d)===1)) continue;   // no two mornings running
      trial.push(d);
    }
    if(trial.length>oatDays.length) oatDays = trial;
  }
  const quickB = pool('breakfast').filter(m=>m.id!==oats && !m.weekend);
  const pancakeDay = pick([5,6]);
  let lastB = null;
  DAYS.forEach((_,i)=>{
    if(oatDays.includes(i)){ days[i].breakfast = oats; lastB = oats; return; }
    if(i === pancakeDay){ days[i].breakfast = 'b-pancakes'; lastB = 'b-pancakes'; return; }
    const options = quickB.filter(m=>m.id!==lastB);
    const chosenB = pick(options.length ? options : quickB);
    days[i].breakfast = chosenB.id; lastB = chosenB.id;
  });

  /* Lunch. A lunch that leans on a batch (beef wraps, chicken sandwich) is only
     allowed on a day already covered by that batch — otherwise it would force a
     second cook of the same thing. Everything else falls back to a base-free
     sandwich or the previous night's leftovers. */
  const sessionOf = (base, dayIdx) => ((dayIdx+1) <= (PREP[base].keeps||4)) ? 'sun' : 'mid';
  const covered = {};                                  // base -> Set of sessions already being cooked
  const noteCover = (base, dayIdx) => { (covered[base] = covered[base] || new Set()).add(sessionOf(base, dayIdx)); };
  DAYS.forEach((_,i)=> SLOTS.filter(s=>s.k!=='lunch').forEach(s=>{
    const m = byId(days[i][s.k]);
    mainBases(m).forEach(b=>noteCover(b, i));
  }));

  /* Three lunches ("any cooked protein, over rice / in a salad") only make sense
     on a day when a batch protein is actually sitting in the fridge. */
  const proteinReady = dayIdx => Object.keys(covered).some(b =>
    PREP[b].protein && covered[b].has(sessionOf(b, dayIdx)));
  const lunchFits = (m, dayIdx) =>
    m.id!==lastL
    && mainBases(m).every(b => covered[b] && covered[b].has(sessionOf(b, dayIdx)))
    && (!m.leftoverProtein || proteinReady(dayIdx));

  const plainLunches  = shuffle(pool('lunch').filter(m=>m.id!=='l-reheat' && !mainBases(m).length));
  const batchLunches  = shuffle(pool('lunch').filter(m=>m.id!=='l-reheat' && mainBases(m).length));
  let li=0, lastL=null;
  DAYS.forEach((_,i)=>{
    const prevDinner = i>0 ? byId(days[i-1].dinner) : null;
    if(prevDinner && mainBases(prevDinner).length && lastL!=='l-reheat' && Math.random()<0.5){
      days[i].lunch = 'l-reheat';
    } else {
      const free  = batchLunches.filter(m=>lunchFits(m, i));
      const plain = plainLunches.filter(m=>lunchFits(m, i));
      const fallback = plainLunches.filter(m=>m.id!==lastL);
      const chosenL = (free.length && Math.random()<0.6)
        ? pick(free)
        : (plain.length ? plain[li++ % plain.length] : fallback[li++ % fallback.length]);
      days[i].lunch = chosenL.id;
      mainBases(chosenL).forEach(b=>noteCover(b, i));
    }
    lastL = days[i].lunch;
  });

  const s1 = shuffle(pool('snack1'));
  const s2 = shuffle(pool('snack2'));
  DAYS.forEach((_,i)=>{ days[i].snack1 = s1[i%s1.length].id; days[i].snack2 = s2[i%s2.length].id; });

  return days;
}

/* Next week becomes this week and is locked; a fresh next week is drawn. The one
   destructive action in the app, so it is a function rather than inline in the
   button handler — that way a test can call it. */
function rollover(){
  state.current = { days: state.next.days, kindy: state.next.kindy, locked:true };
  state.next    = { days: buildWeek(), kindy: state.next.kindy.slice(), locked:false };
  state.view    = 'current';
}

function generate(){
  if(!editable()) return;
  wk().days = buildWeek();
  save(); render();
}

/* ---------- persistence ----------
   Local storage is always written, so the app still works offline and
   the plan survives a dropped connection. When SYNC is configured the
   same payload goes to the shared database, and whichever device saved
   last wins — fine for two people who are not editing simultaneously. */
const KEY = 'weekservice:v2';
const cloudOn = () => !!SYNC.url;
const cloudURL = () => `${SYNC.url.replace(/\/$/,'')}/${SYNC.path}.json`;
let syncStatus = cloudOn() ? 'connecting' : 'local';

const local = {
  get(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } },
  set(v){ try{ localStorage.setItem(KEY, v); }catch(e){} }
};

async function cloudGet(){
  if(!cloudOn()) return null;
  try{
    const r = await fetch(cloudURL(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    syncStatus = 'ok';
    return (j && j.payload) ? j.payload : null;
  }catch(e){ syncStatus = 'offline'; return null; }
}
async function cloudSet(v){
  if(!cloudOn()) return;
  try{
    const r = await fetch(cloudURL(), {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ payload:v, at: Date.now() })
    });
    syncStatus = r.ok ? 'ok' : 'offline';
  }catch(e){ syncStatus = 'offline'; }
}

async function save(){
  const v = JSON.stringify(state);
  local.set(v);
  await cloudSet(v);
  paintSync();
}

/* ---------- share link: the whole plan, encoded in the URL ---------- */
function encodeState(){
  const packWeek = w => ({ d: w.days.map(d=>WIRE_SLOTS.map(k=>d[k])), k: w.kindy, l: w.locked?1:0 });
  const payload = { c: packWeek(state.current), n: packWeek(state.next) };
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}
function decodeState(str){
  const p = JSON.parse(decodeURIComponent(escape(atob(str))));
  const unpack = w => ({
    days: w.d.map(row=>{ const o={}; WIRE_SLOTS.forEach((k,i)=>o[k]=row[i]); return o; }),
    kindy: w.k || [], locked: !!w.l
  });
  return { current: unpack(p.c), next: unpack(p.n), view:'current' };
}
function shareLink(){
  const base = location.href.split('#')[0];
  return base + '#w=' + encodeState();
}

async function load(){
  const hash = location.hash;
  if(hash.startsWith('#w=')){
    try{ state = decodeState(hash.slice(3)); render(true); return; }
    catch(e){ /* fall through to normal load */ }
  }

  let raw = await cloudGet();          // shared plan wins when it exists
  if(!raw) raw = local.get();
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = null; } }

  if(!state || !state.current){
    state = {
      current: { days: buildWeek(), kindy:[3,4], locked:true },
      next:    { days: buildWeek(), kindy:[3,4], locked:false },
      view: 'current'
    };
    await save();
  }
  if(!state.view) state.view='current';
  render();

  /* Coming back to the tab picks up anything the other person changed. */
  if(cloudOn()){
    window.addEventListener('focus', async ()=>{
      const remote = await cloudGet();
      if(!remote) { paintSync(); return; }
      if(remote !== JSON.stringify(state)){
        try{ state = JSON.parse(remote); render(); }catch(e){}
      }
      paintSync();
    });
  }
}

/* ---------- prep derivation (per viewed week) ----------
   Sunday session is day 0; Monday is day 1 ... Sunday is day 7.
   The Wednesday top-up is day 3.
   An item is prepped at the latest session that still lands inside its
   shelf life for the day it is needed. Long-keeping things (boiled eggs)
   get done once on Sunday; short-keeping things (cut fruit, raw marinade)
   move to Wednesday when they are only needed late in the week. */
const SUNDAY_DAY = 0, MIDWEEK_DAY = 3;

function prepPlan(){
  const w = wk();
  const need = {};                                     // baseId -> Set of day numbers 1..7
  const mark = (base, dayIdx) => { (need[base] = need[base] || new Set()).add(dayIdx+1); };
  w.days.forEach((d,i)=> SLOTS.forEach(s=>{
    const m = byId(d[s.k]);
    basesOf(m).forEach(b=>mark(b, i));
  }));
  w.kindy.forEach(i=> mark('crunch-box', i));

  const sunday=[], midweek=[];
  Object.keys(need).forEach(b=>{
    const keeps = PREP[b].keeps || 4;
    const days = [...need[b]].sort((a,z)=>a-z);
    const sun = days.filter(d => d - SUNDAY_DAY  <= keeps);
    const mid = days.filter(d => d - SUNDAY_DAY  >  keeps);
    if(sun.length) sunday.push({id:b, days:sun, firstDay:sun[0]-1, keeps, mins:PREP[b].mins});
    if(mid.length) midweek.push({id:b, days:mid, firstDay:mid[0]-1, keeps,
                                 /* already made on Sunday? then Wednesday is just a top-up */
                                 mins: (sun.length && PREP[b].topUpMins) ? PREP[b].topUpMins : PREP[b].mins,
                                 topUp: !!(sun.length && PREP[b].topUpMins),
                                 late: mid.filter(d => d - MIDWEEK_DAY > keeps)});
  });
  const bySoonest = (a,b)=>a.firstDay-b.firstDay;
  const t = arr => arr.reduce((s,x)=>s+x.mins,0);
  return { sunday:sunday.sort(bySoonest), midweek:midweek.sort(bySoonest),
           sundayMins:t(sunday), midweekMins:t(midweek) };
}

/* "Mon–Thu" / "Thu, Fri" style coverage label for a session */
function coverLabel(list){
  const all = [...new Set(list.flatMap(x=>x.days))].sort((a,b)=>a-b);
  if(!all.length) return '';
  const names = all.map(d=>DAYS[d-1]);
  const contiguous = all.every((d,i)=> i===0 || d===all[i-1]+1);
  return (contiguous && names.length>2) ? `${names[0]}\u2013${names[names.length-1]}` : names.join(', ');
}

/* ---------- render ---------- */
let sharedView = false;

function paintSync(){
  const el = document.getElementById('syncChip');
  if(!el) return;
  const map = {
    local:      ['This device only', '#7E9695'],
    connecting: ['Connecting\u2026',  '#7E9695'],
    ok:         ['Synced',           '#6FCF97'],
    offline:    ['Offline \u2014 saved here', '#E0A008']
  };
  const [text,color] = map[syncStatus] || map.local;
  el.innerHTML = `<span style="color:${color}">&bull; ${text}</span>`;
}

function render(isShared){
  if(isShared!==undefined) sharedView = isShared;
  paintSync();
  const w = wk();
  const locked = w.locked;

  /* tabs + lock */
  document.getElementById('tabCurrent').setAttribute('aria-selected', state.view==='current');
  document.getElementById('tabNext').setAttribute('aria-selected', state.view==='next');
  document.getElementById('tabCurrent').innerHTML = 'This week' + (state.current.locked?'<span class="pin">&#128274;</span>':'');
  document.getElementById('tabNext').innerHTML = 'Next week' + (state.next.locked?'<span class="pin">&#128274;</span>':'');
  const lockBtn = document.getElementById('lockBtn');
  lockBtn.textContent = locked ? 'Locked' : 'Lock this week';
  lockBtn.classList.toggle('on', locked);
  document.getElementById('lockNote').textContent = locked ? 'Read only' : 'Editable';
  document.getElementById('gen').disabled = locked;
  document.getElementById('roll').style.display = state.view==='next' ? '' : 'none';

  /* banner */
  const banner = document.getElementById('banner');
  if(sharedView){
    banner.innerHTML = `<div class="locked-banner"><b>Shared plan.</b> You are looking at a plan someone sent you. Changes here stay on this device.</div>`;
  } else if(locked){
    banner.innerHTML = `<div class="locked-banner"><b>${state.view==='current'?'This week':'Next week'} is locked</b> &mdash; no generating, no swapping. Tap <b>Locked</b> above to make changes, or switch to <b>Next week</b>, which is editable.</div>`;
  } else banner.innerHTML = '';

  /* targets rail */
  document.getElementById('targets').innerHTML =
    SLOTS.map(s=>`<div class="t-cell"><div class="t-lab">${s.lab}</div><div class="t-val mono">${TARGETS[s.k]}<em>kcal</em></div></div>`).join('')
    + `<div class="t-cell total"><div class="t-lab">Daily target</div><div class="t-val mono">${DAILY.cal}<em>kcal</em> &middot; ${DAILY.protein}<em>g pro</em></div></div>`;

  const plan = prepPlan();

  /* prep + tools rail, deliberately outside the seven days */
  const midOn = plan.midweek.length > 0;
  const rail = document.getElementById('rail');
  rail.innerHTML = `
    <div class="rail-lab">Prep</div>
    <button class="prep-card ${plan.sunday.length?'':'quiet'}" data-prep="sunday">
      <span><span class="pc-when">Before Monday</span>
      <span class="pc-note">${plan.sunday.length ? `${plan.sunday.length} task${plan.sunday.length>1?'s':''} &middot; covers ${coverLabel(plan.sunday)}` : 'Nothing to prep this week'}</span></span>
      <span class="pc-mins"><b class="mono">${plan.sundayMins}</b><span>min</span></span>
    </button>
    <button class="prep-card ${midOn?'':'quiet'}" data-prep="midweek">
      <span><span class="pc-when">Wednesday top-up</span>
      <span class="pc-note">${midOn ? `${plan.midweek.length} task${plan.midweek.length>1?'s':''} &middot; covers ${coverLabel(plan.midweek)}` : 'Not needed this week'}</span></span>
      <span class="pc-mins"><b class="mono">${plan.midweekMins}</b><span>min</span></span>
    </button>
    <button class="prep-card tool" data-tool="shop">
      <span><span class="pc-when">Shopping</span><span class="pc-note">For this week's meals</span></span>
    </button>
    <button class="prep-card tool" data-tool="kindy">
      <span><span class="pc-when">Kindy</span><span class="pc-note">${w.kindy.length} supplied day${w.kindy.length===1?'':'s'}</span></span>
    </button>`;
  rail.querySelectorAll('[data-prep]').forEach(b=>b.onclick=()=>openPrep(b.dataset.prep));
  rail.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=> b.dataset.tool==='shop' ? openShop() : openKindy());

  /* board */
  const board = document.getElementById('board');
  board.innerHTML = '';
  w.days.forEach((d,i)=>{
    const meals = SLOTS.map(s=>byId(d[s.k]));
    const total = meals.reduce((s,m)=>s+cal(m),0);
    const protein = meals.reduce((s,m)=>s+pro(m),0);
    const isKindy = w.kindy.includes(i);
    const diff = total - DAILY.cal;
    const cls = Math.abs(diff)<=90 ? '' : (diff>0 ? 'over':'under');

    const el = document.createElement('section');
    el.className='day';
    el.innerHTML = `
      <div class="day-head">
        <span class="day-name">${DAYS[i]}</span>
        <button class="kindy-tag ${isKindy?'':'off'}" data-kindy="${i}" ${locked?'disabled':''} title="Toggle a kindy-box day">Kindy</button>
      </div>
      <div class="bar">${meals.map(m=>`<i style="width:${total?(cal(m)/total*100):0}%"></i>`).join('')}</div>
      <div class="slots">
        ${SLOTS.map((s,si)=>{
          const m = meals[si];
          return `<div style="position:relative">
            <button class="slot" data-open="${i}:${s.k}">
              <span class="slot-lab">${s.lab}${m&&m.mins?`<span class="mins mono">${m.mins}m</span>`:''}</span>
              <span class="slot-name">${m?m.name:'&mdash;'}</span>
              <span class="slot-nums"><span class="kcal mono">${cal(m)}<em>kcal</em></span><span class="pro mono">${pro(m)}g</span></span>
            </button>
            ${locked?'':`<button class="swap" data-swap="${i}:${s.k}" title="Swap this meal" aria-label="Swap ${s.lab}">&#8646;</button>`}
          </div>`;
        }).join('')}
      </div>
      <div class="day-foot">
        <span class="day-tot mono ${cls}">${total}<span style="font-size:9px;color:var(--muted)"> kcal</span></span>
        <span class="day-pro mono">${protein}g protein</span>
      </div>`;
    board.appendChild(el);
  });

  board.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const[d,s]=b.dataset.open.split(':');openMeal(+d,s);});
  board.querySelectorAll('[data-swap]').forEach(b=>b.onclick=e=>{e.stopPropagation();const[d,s]=b.dataset.swap.split(':');openSwap(+d,s);});
  board.querySelectorAll('[data-kindy]').forEach(b=>b.onclick=()=>{
    if(!editable()) return;
    const i=+b.dataset.kindy;
    wk().kindy = wk().kindy.includes(i) ? wk().kindy.filter(x=>x!==i) : [...wk().kindy,i].sort();
    save(); render();
  });
}

/* ---------- drawer ---------- */
const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');
function showDrawer(eyebrow,title,meta,body){
  document.getElementById('dEyebrow').textContent=eyebrow;
  document.getElementById('dTitle').textContent=title;
  document.getElementById('dMeta').innerHTML=meta;
  document.getElementById('dBody').innerHTML=body;
  document.getElementById('dBody').scrollTop=0;
  drawer.classList.add('on'); scrim.classList.add('on');
  document.getElementById('dClose').focus();
}
function closeDrawer(){ drawer.classList.remove('on'); scrim.classList.remove('on'); }
document.getElementById('dClose').onclick=closeDrawer;
scrim.onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

function openMeal(dayIdx, slotKey){
  const m = byId(wk().days[dayIdx][slotKey]);
  if(!m) return;
  const c=cal(m), p=pro(m), t=TARGETS[slotKey], diff=c-t;
  const slotLab = SLOTS.find(s=>s.k===slotKey).lab;

  const meta = `
    <div>Your portion<b class="mono">${c} kcal</b></div>
    <div>Protein<b class="mono">${p}g</b></div>
    <div>Hands-on<b class="mono">${m.mins} min</b></div>
    ${basesOf(m).length?`<div>Needs prep<b style="font-size:12px">${basesOf(m).map(b=>PREP[b].name).join(', ')}</b></div>`:''}`;

  let body = editable()
    ? `<button class="swap-cta" id="swapCta">&#8646; Swap this meal</button>`
    : `<div class="foot-note" style="margin:0 0 18px">${state.view==='current'?'This week':'Next week'} is locked, so meals can't be changed. Unlock it at the top to swap this one.</div>`;
  body += `<p class="d-blurb">${m.blurb}</p>`;
  body += `<div class="sec"><div class="sec-lab">Your portion <span>weigh the protein and the carb</span></div>`;
  m.portions.forEach(x=>{
    body += `<div class="port"><span class="port-n">${x.n}</span><span class="port-a mono">${x.a}</span><span class="port-c mono">${x.c} kcal</span></div>`;
  });
  body += `<div class="port sum"><span class="port-n">Total</span><span class="port-a mono">${p}g pro</span><span class="port-c mono">${c} kcal</span></div>`;
  body += `<p class="budget-note ${diff>60?'over':''}">Budget for ${slotLab.toLowerCase()} is <b class="mono">${t} kcal</b>. This is <b class="mono">${diff>0?'+':''}${diff}</b>${Math.abs(diff)<=60?', which is inside the noise.':diff>0?' &mdash; trim the carb or take it off the late snack.':', so you have room elsewhere.'}</p></div>`;

  if(m.steps){
    body += `<div class="sec"><div class="sec-lab">Method <span>${m.mins} min</span></div><ol class="steps">${m.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>`;
  } else {
    body += `<div class="sec"><div class="sec-lab">Method</div><p class="empty-note">Assembly only. Nothing to cook.</p></div>`;
  }
  if(basesOf(m).length){
    body += `<div class="sec"><div class="sec-lab">Depends on prep <span>${basesOf(m).length} item${basesOf(m).length>1?'s':''}</span></div>`
      + basesOf(m).map(b=>{ const pr=PREP[b];
          return `<div class="task"><div class="task-n">${pr.name}</div>
            <div class="task-m mono">${pr.mins} min &middot; ${pr.storage} &middot; keeps ${pr.keeps} days</div>
            <ol>${pr.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div>`; }).join('')
      + `</div>`;
  }
  body += `<div class="sec"><div class="sec-lab">The rest of the table</div>
    <p class="d-blurb" style="margin:0">Roshani and Milan eat the same components, unweighed. Serve everything separately rather than mixed and they can take what they want without you cooking twice.</p></div>`;

  showDrawer(`${DAYS[dayIdx]} · ${slotLab}`, m.name, meta, body);
  const cta = document.getElementById('swapCta');
  if(cta) cta.onclick = ()=> openSwap(dayIdx, slotKey);
}

function openSwap(dayIdx, slotKey){
  if(!editable()) return;
  const cur = wk().days[dayIdx][slotKey];
  const slotLab = SLOTS.find(s=>s.k===slotKey).lab;
  const body = `<p class="d-blurb">Pick a replacement. The prep list and shopping list update straight away.</p>` +
    pool(slotKey).map(m=>{
      const dep = basesOf(m).length?`<i>needs ${basesOf(m).map(b=>PREP[b].name.toLowerCase()).join(' + ')}</i>`:`<i>no prep needed</i>`;
      return `<button class="alt ${m.id===cur?'cur':''}" data-pick="${m.id}">
        <span class="alt-n">${m.name}${dep}</span>
        <span class="alt-c mono">${cal(m)} kcal<br>${pro(m)}g pro</span></button>`;
    }).join('');
  showDrawer(`${DAYS[dayIdx]} · swap`, slotLab, `<div>Budget<b class="mono">${TARGETS[slotKey]} kcal</b></div>`, body);
  document.getElementById('dBody').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    wk().days[dayIdx][slotKey]=b.dataset.pick; save(); render(); closeDrawer();
  });
}

function openPrep(which){
  const plan = prepPlan();
  const list = which==='sunday'?plan.sunday:plan.midweek;
  const mins = which==='sunday'?plan.sundayMins:plan.midweekMins;
  const title = which==='sunday'?'Before Monday':'Wednesday top-up';
  const w = wk();

  let body = which==='sunday'
    ? `<p class="d-blurb">The Sunday <em>before</em> this week starts. Run these in parallel &mdash; the pressure cooker, the oven and your hands are three separate workstreams.</p>`
    : `<p class="d-blurb">Cooked protein is good for about four days and cut fruit for three, so this is the short Wednesday top-up for the back half of the week.</p>`;

  if(!list.length){
    body += `<p class="empty-note">Nothing needed here. Everything this ${which==='sunday'?'session would cover keeps fine, or cooks fresh':'half of the week keeps from Sunday, or cooks fresh'}.</p>`;
  } else {
    body += list.map(x=>{
      const p=PREP[x.id];
      const users = [];
      w.days.forEach((d,i)=>{
        if(!x.days.includes(i+1)) return;
        SLOTS.forEach(s=>{ const m=byId(d[s.k]); if(basesOf(m).includes(x.id)) users.push(`${DAYS[i]} ${s.lab.toLowerCase()}`); });
        if(x.id==='crunch-box' && w.kindy.includes(i)) users.push(`${DAYS[i]} kindy box`);
      });
      const lastDay = x.days[x.days.length-1];
      const age = lastDay - (which==='sunday'?SUNDAY_DAY:MIDWEEK_DAY);
      const warn = (x.late && x.late.length)
        ? `<div class="foot-note" style="margin-top:8px">Needed ${x.late.map(d=>DAYS[d-1]).join(' and ')}, which is past its ${x.keeps}-day keep even from Wednesday. Cook this one fresh on the day instead.</div>` : '';
      return `<div class="task">
        <div class="task-n">${p.name}${x.topUp?' <span class="chip" style="vertical-align:middle">top-up</span>':''}</div>
        <div class="task-m mono">${x.mins} min &middot; ${p.storage} &middot; keeps ${x.keeps} days &middot; oldest serve ${age} day${age===1?'':'s'}${p.freezes?' &middot; freezes well':''}</div>
        <ol>${p.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
        <div style="margin-top:7px">${users.map(u=>`<span class="chip">${u}</span>`).join('')}</div>
        ${warn}
      </div>`;
    }).join('');
  }
  if(which==='sunday'){
    body += `<div class="foot-note">Cool everything fully before it goes in a container. Warm food in a sealed box is how a Sunday cook turns into a Wednesday stomach ache.</div>`;
  }
  showDrawer(state.view==='current'?'This week':'Next week', title, `<div>Hands-on<b class="mono">${mins} min</b></div><div>Tasks<b class="mono">${list.length}</b></div>`, body);
}

/* ---------- shopping quantities ----------
   Two meals wanting the same thing is not the same as needing twice as much. A
   pack word (jar, bottle, loaf) is a container: however many meals want soy sauce,
   you buy one bottle. Anything else is an amount, and amounts add up. */
const PACKS = ['jar','bottle','pkt','packet','bag','tub','loaf','box','bunch','head',
               'knob','bulb','punnet','carton','block','tin','can','dozen'];
const SCALE = { kg:['g',1000], g:['g',1], l:['ml',1000], ml:['ml',1] };

function parseQty(q){
  const m = /^(\d+(?:\.\d+)?)\s*(.*)$/.exec(String(q).trim());
  if(!m) return null;
  let n = parseFloat(m[1]), u = m[2].trim().toLowerCase();
  const sc = SCALE[u];
  if(sc){ n *= sc[1]; u = sc[0]; }
  else u = u.replace(/(es|s)$/,'');                 // bunches -> bunch, tubs -> tub
  return { n, u, pack: u.split(/[\s×]+/).some(w=>PACKS.includes(w)) };
}
function fmtQty(n, u){
  const r = x => +x.toFixed(2);
  if(u==='g'  && n>=1000) return `${r(n/1000)}kg`;
  if(u==='ml' && n>=1000) return `${r(n/1000)}L`;
  if(u==='g' || u==='ml') return `${Math.round(n)}${u}`;
  if(!u) return `${r(n)}`;
  return `${r(n)} ${u}${n>1 && u!=='dozen' && /^[a-z]+$/.test(u) ? 's' : ''}`;
}
/* One line out of however many meals asked for it. */
function totalQty(qs){
  const parts = qs.map(parseQty);
  if(parts.every(Boolean) && new Set(parts.map(x=>x.u)).size===1){
    const nums = parts.map(x=>x.n);
    return fmtQty(parts[0].pack ? Math.max(...nums) : nums.reduce((a,b)=>a+b,0), parts[0].u);
  }
  return [...new Set(qs)].join(' + ');                // shouldn't happen; a test guards it
}

function shoppingList(w){
  const items = new Map();
  const add = b => { const k=b.n.toLowerCase();
    if(!items.has(k)) items.set(k,{...b, qs:[b.q]}); else items.get(k).qs.push(b.q); };
  const seenPrep = new Set(), seenMeal = new Set();
  w.days.forEach(d=>SLOTS.forEach(s=>{
    const m=byId(d[s.k]); if(!m) return;
    if(!seenMeal.has(m.id)){ seenMeal.add(m.id); (m.buy||[]).forEach(add); }
    basesOf(m).forEach(b=>{ if(seenPrep.has(b)) return; seenPrep.add(b); (PREP[b].buy||[]).forEach(add); });
  }));
  if(w.kindy.length && !seenPrep.has('crunch-box')) (PREP['crunch-box'].buy||[]).forEach(add);
  STAPLES.forEach(add);
  return items;
}

function openShop(){
  const w = wk();
  const items = shoppingList(w);

  const cats = ['Meat & fish','Fruit & veg','Dairy & eggs','Bakery','Frozen','Pantry'];
  let body = `<p class="d-blurb">Built from ${state.view==='current'?'this week':'next week'}'s meals and their prep, plus the coffee and milk you go through regardless. Pantry items are listed even if you already have them &mdash; glance down the list rather than trusting memory.</p>`;
  cats.forEach(c=>{
    const rows=[...items.values()].filter(x=>x.c===c);
    if(!rows.length) return;
    body += `<div class="cat-h">${c}</div><ul class="plain">` +
      rows.map(r=>`<li>${r.n}<b class="mono">${totalQty(r.qs)}</b></li>`).join('') + `</ul>`;
  });
  showDrawer(state.view==='current'?'This week':'Next week', 'Shopping list', `<div>Lines<b class="mono">${items.size}</b></div>`, body);
}

function openKindy(){
  const w = wk();
  if(!w.kindy.length){
    showDrawer('Kindy','Kindy boxes','', `<p class="empty-note">No kindy days selected. Tap the Kindy tag on a day to mark the days you supply food.</p>`);
    return;
  }
  const l=shuffle(KINDY.lunch), m=shuffle(KINDY.morning), a=shuffle(KINDY.afternoon);
  let body = `<p class="d-blurb">Five minutes on the morning: the veg sticks are already cut and the fruit takes a minute. Milan is a good eater, so this is about keeping variety up rather than winning him over.</p>`;
  w.kindy.forEach((di,n)=>{
    body += `<div class="sess"><div class="sess-h"><h3>${DAYS[di]}</h3><span>morning tea &middot; lunch &middot; afternoon tea</span></div>
      <ul class="plain">
        <li>Morning tea<b>${m[n%m.length]}</b></li>
        <li>Lunch<b>${l[n%l.length]}</b></li>
        <li>Afternoon tea<b>${a[n%a.length]}</b></li>
      </ul></div>`;
  });
  body += `<div class="foot-note">Cut the fruit and veg for these in the same fifteen minutes as your own crunch box. Same knife, same board.</div>`;
  showDrawer('Supplied days','Kindy boxes',`<div>Days<b class="mono">${w.kindy.length}</b></div>`, body);
}

function openShare(){
  const url = shareLink();
  const body = `<p class="d-blurb">This link carries both weeks inside it. Send it to Roshani and she will see exactly this plan &mdash; no account, no login. Generate a fresh link whenever the plan changes.</p>
    <div class="share-url" id="urlBox">${url}</div>
    <button class="copy-btn" id="copyBtn">Copy link</button>
    <div class="foot-note">The link is long because the whole plan travels in it. It works fine in a message or an email, and it will not fit in a QR code.</div>`;
  showDrawer('Two devices','Share this plan','',body);
  document.getElementById('copyBtn').onclick=async()=>{
    const b=document.getElementById('copyBtn');
    try{ await navigator.clipboard.writeText(url); b.textContent='Copied'; }
    catch(e){
      const r=document.createRange(); r.selectNodeContents(document.getElementById('urlBox'));
      const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
      b.textContent='Selected — copy it';
    }
    setTimeout(()=>b.textContent='Copy link',2200);
  };
}

function exportData(){
  const blob = new Blob([JSON.stringify({TARGETS,DAILY,PREP,MEALS,KINDY,state},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='meal-data.json'; a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- controls ---------- */
document.getElementById('tabCurrent').onclick=()=>{ state.view='current'; save(); render(false); };
document.getElementById('tabNext').onclick=()=>{ state.view='next'; save(); render(false); };

document.getElementById('lockBtn').onclick=()=>{ wk().locked = !wk().locked; save(); render(); };

/* Generate needs a second tap. No dialog, because dialogs are awful on a phone. */
let armed=false, armTimer=null;
const genBtn=document.getElementById('gen');
genBtn.onclick=()=>{
  if(!editable()) return;
  if(!armed){
    armed=true; genBtn.classList.add('confirming');
    genBtn.textContent='Tap again to replace';
    armTimer=setTimeout(()=>{ armed=false; genBtn.classList.remove('confirming'); genBtn.textContent='Generate week'; },3500);
    return;
  }
  clearTimeout(armTimer); armed=false;
  genBtn.classList.remove('confirming'); genBtn.textContent='Generate week';
  generate();
};

/* Roll next week into current, then build a fresh next week. */
let rollArmed=false, rollTimer=null;
const rollBtn=document.getElementById('roll');
rollBtn.onclick=()=>{
  if(!rollArmed){
    rollArmed=true; rollBtn.classList.add('confirming'); rollBtn.textContent='Tap again to confirm';
    rollTimer=setTimeout(()=>{ rollArmed=false; rollBtn.classList.remove('confirming'); rollBtn.textContent='Start new week'; },3500);
    return;
  }
  clearTimeout(rollTimer); rollArmed=false;
  rollBtn.classList.remove('confirming'); rollBtn.textContent='Start new week';
  rollover();
  save(); render();
};

document.getElementById('share').onclick=openShare;
document.getElementById('exp').onclick=exportData;

load();
</script>
